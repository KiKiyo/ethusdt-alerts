name: External five-minute monitor
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ethusdt-monitor
  cancel-in-progress: false
jobs:
  monitor:
    # Public standard runner; AI is called only after a new eligible candidate.
    if: github.event.repository.private == false && vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Read closed candles and notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_CRYPTOBLOWER_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_ENABLED: ${{ vars.MONITOR_ENABLED }}
          TRIAL_UNTIL: ${{ vars.TRIAL_UNTIL }}
          BOOTSTRAP_STATE: ${{ vars.BOOTSTRAP_STATE }}
          # User approved conditional paid review on 2026-10-25; durable quotas remain enforced.
          AI_ENABLED: 'true'
          AI_PAID_APPROVED: 'true'
          OPENAI_MODEL: 'gpt-5.4-mini-2026-03-17'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 monitor.py
