name: ETHUSDT free trial
on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ethusdt-monitor
  cancel-in-progress: false
jobs:
  monitor:
    # No private runner job is started. No artifacts/cache or paid models.
    if: github.event.repository.private == false && vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate saved private recipient (manual deployment only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_CRYPTOBLOWER_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIAL_UNTIL: ${{ vars.TRIAL_UNTIL }}
        run: python3 telegram_ready.py
      - name: Read closed candles and notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_CRYPTOBLOWER_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_ENABLED: ${{ vars.MONITOR_ENABLED }}
          TRIAL_UNTIL: ${{ vars.TRIAL_UNTIL }}
          BOOTSTRAP_STATE: ${{ vars.BOOTSTRAP_STATE }}
          # Both gates stay false until separate paid-use approval.
          AI_ENABLED: 'false'
          AI_PAID_APPROVED: 'false'
          OPENAI_MODEL: 'gpt-5.4-mini-2026-03-17'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 monitor.py
